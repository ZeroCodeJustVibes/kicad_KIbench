[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kibench"
dynamic = ["version"]
description = "KiCad 10 part assistant: search, datasheets, symbol/footprint import, footprint matcher, builders, design-aware chat"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Niklas Hahn" }]
dependencies = [
    "PySide6>=6.8,<6.12",
    "cascadio",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "keyring>=24",
    "kicad-python>=0.4.0",
    "anthropic>=0.75",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kibench = "kibench.app:main"

[tool.setuptools.dynamic]
version = { attr = "kibench.__version__" }

[tool.setuptools.packages.find]
include = ["kibench*"]

[tool.setuptools.package-data]
kibench = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
